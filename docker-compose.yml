version: '3'

services:
  nginx:
    image: nginx:1.22-alpine
    ports:
      - "8110:80"
      - "8443:443"
    volumes:
      - ./html:/var/www/html
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl-cert.pem:/etc/nginx/ssl/ssl-cert.pem
      - ./ssl-key.pem:/etc/nginx/ssl/ssl-key.pem
    depends_on:
      - php

  php:
    build: .
    volumes:
      - ./html:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: easyportal
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3386:3386"

 

volumes:
  dbdata:
