events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    types {
        application/javascript js;
    }

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name localhost;

        root /var/www/html;
        index index.php index.html;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location / {
            try_files $uri $uri/ $uri.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|ttf|map|mp4|webm|ogv|ogg|mp3|wav|flac)$ {
            expires max;
            log_not_found off;
        }
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/ssl/ssl-cert.pem;
        ssl_certificate_key /etc/nginx/ssl/ssl-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/html;
        index index.php index.html;

        access_log /var/log/nginx/access_ssl.log;
        error_log /var/log/nginx/error_ssl.log;

        location / {
            try_files $uri $uri/ $uri.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf|ttf|map|mp4|webm|ogv|ogg|mp3|wav|flac)$ {
            expires max;
            log_not_found off;
        }
    }
}
