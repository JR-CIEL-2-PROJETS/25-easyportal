<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/plaques.css"> <!-- Lien vers le CSS des plaques -->
    <title>Easy Portal - Voir Plaques</title>
</head>
<body>
    <div class="header">
        <div class="logo">✦Easy Portal</div>
    </div>

    <div class="main">
        <h2>Voir Plaques</h2>
        
        <div class="add-plaque-container">
            <input type="text" id="plaqueInput" placeholder="Ajouter une nouvelle plaque" />
            <button id="addPlaqueButton">Ajouter Plaque</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Rechercher par numéro" oninput="filterPlaques()" />
        </div>
        
        <div class="plaques-container">
            <table>
                <thead>
                    <tr>
                        <th>Utilisateur</th>
                        <th>Plaque</th>
                        <th>État</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="plaquesTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let plaquesData = [];
        const userEmail = new URLSearchParams(window.location.search).get('email');

        async function fetchPlaques() {
            try {
                const response = await fetch(`php/getPlaquesByUser.php?email=${userEmail}`);
                const data = await response.json();

                if (data.success) {
                    plaquesData = data.plaques;
                    displayPlaques(plaquesData);
                } else {
                    console.error("Erreur:", data.message);
                }
            } catch (error) {
                console.error("Erreur lors de la récupération des plaques:", error);
            }
        }

        function displayPlaques(plaques) {
            const tableBody = document.getElementById("plaquesTableBody");
            tableBody.innerHTML = "";
            plaques.forEach(plaque => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${plaque.nom} ${plaque.prenom}</td>
                    <td>${plaque.numero}</td>
                    <td>${plaque.status}</td>
                    <td>
                        <button onclick="toggleState('${plaque.id}', '${plaque.status}')">
                            ${plaque.status === 'actif' ? 'Bloquer' : 'Activer'}
                        </button>
                        <button onclick="deletePlaque('${plaque.id}')">Supprimer</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        async function addPlaque() {
            const plaqueInput = document.getElementById("plaqueInput");
            const plaqueValue = plaqueInput.value.trim();

            if (!plaqueValue) {
                alert("Veuillez entrer un numéro de plaque.");
                return;
            }

            if (plaquesData.length >= 5) {
                alert("Vous ne pouvez pas ajouter plus de 5 plaques.");
                return;
            }

            try {
                const response = await fetch("php/add_plaque.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: userEmail, numero: plaqueValue })
                });
                
                const text = await response.text(); // Obtenez la réponse en texte brut
                console.log(text); // Affichez la réponse dans la console pour le débogage

                const data = JSON.parse(text); // Convertissez le texte en JSON
                if (data.success) {
                    plaqueInput.value = ""; // Réinitialiser le champ de saisie
                    fetchPlaques(); // Récupérer à nouveau les plaques
                } else {
                    alert("Erreur lors de l'ajout de la plaque.");
                }
            } catch (error) {
                console.error("Erreur lors de l'ajout de la plaque:", error);
            }
        }

        async function deletePlaque(plaqueId) {
            if (confirm("Êtes-vous sûr de vouloir supprimer cette plaque ?")) {
                try {
                    const response = await fetch("php/delete_plaque.php", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ id: plaqueId })
                    });
                    const data = await response.json();
                    if (data.success) {
                        fetchPlaques(); // Récupérer à nouveau les plaques
                    } else {
                        alert("Erreur lors de la suppression de la plaque.");
                    }
                } catch (error) {
                    console.error("Erreur lors de la suppression de la plaque:", error);
                }
            }
        }

        async function toggleState(plaqueId, currentState) {
            try {
                const newState = currentState === 'actif' ? 'bloqué' : 'actif';
                const response = await fetch("php/toggle_plaque_state.php", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ id: plaqueId, status: newState })
                });
                const data = await response.json();
                if (data.success) {
                    fetchPlaques(); // Récupérer à nouveau les plaques
                } else {
                    alert("Erreur lors de la mise à jour de l'état de la plaque.");
                }
            } catch (error) {
                console.error("Erreur lors de la mise à jour de l'état de la plaque:", error);
            }
        }

        document.getElementById("addPlaqueButton").addEventListener("click", addPlaque);
        document.addEventListener("DOMContentLoaded", fetchPlaques);
    </script>
</body>
</html>
