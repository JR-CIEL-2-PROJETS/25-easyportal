<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/user-admin.css">
    <title>Easy Portal - Utilisateurs</title>
</head>
<body>
    <div class="header">
        <div class="logo">✦Easy Portal</div>
        <div class="user-name" id="userName">Chargement...</div>
    </div>

    <div class="sidebar">
        <a href="#">Dashboard</a>
        <a href="user.html" class="active">Utilisateurs</a>
        <a href="admin.html">Admin</a>
        <a href="plaques.html">Plaques</a>
        <a href="portail.html">Portail</a>
        <a href="log.html">Logs</a>
    </div>

    <div class="main">
        <div class="title">Utilisateurs</div>
        <div id="alertContainer"></div>

        <div class="search-container">
            <a href="ajouterUser.html" class="btn-add">Ajouter</a>
            <div class="search-bar">
                <span>🔎</span>
                <input type="text" id="searchInput" placeholder="Rechercher un utilisateur..." oninput="filterUsers()">
            </div>
        </div>

        <table class="table">
            <thead>
                <tr>
                    <th>Prénom</th>
                    <th>Nom</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Temps d'accès</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="userTableBody"></tbody>
        </table>
    </div>

    <script src="js/dejaconnecter.js"></script>
    <script>
        let usersData = [];

        async function fetchUsers() {
            try {
                const response = await fetch("php/getUsers.php");
                const data = await response.json();

                if (data.success) {
                    usersData = data.users;
                    displayUsers(usersData);
                } else {
                    console.error("Erreur:", data.message);
                }
            } catch (error) {
                console.error("Erreur lors de la récupération des utilisateurs:", error);
            }
        }

        function displayUsers(users) {
            const tableBody = document.getElementById("userTableBody");
            tableBody.innerHTML = "";
            users.forEach(user => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${user.prenom}</td>
                    <td>${user.nom}</td>
                    <td>${user.email}</td>
                    <td>${user.role}</td>
                    <td>
                        ${user.role === "utilisateur" ? "Illimité" : `
                        <input type="date" class="date-input" id="date-${user.id}" value="${user.date_fin || ''}">
                        <button class="btn-set-date" onclick="setDate(${user.id})">Définir</button>
                        `}
                    </td>
                    <td>
                        <button class="delete-button" onclick="deleteUser(${user.id}, '${user.prenom}', '${user.nom}')">Supprimer</button>
                        <button class="plaques-button" onclick="viewPlaques('${user.email}')">Voir plaques</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        function viewPlaques(email) {
            // Redirection vers la page voir-plaques.html avec l'email de l'utilisateur
            window.location.href = `voir-plaques.html?email=${encodeURIComponent(email)}`;
        }

        function filterUsers() {
            const searchInput = document.getElementById("searchInput").value.toLowerCase();
            displayUsers(usersData.filter(user =>
                user.prenom.toLowerCase().includes(searchInput) ||
                user.nom.toLowerCase().includes(searchInput) ||
                user.email.toLowerCase().includes(searchInput) ||
                user.role.toLowerCase().includes(searchInput)
            ));
        }

        document.addEventListener("DOMContentLoaded", fetchUsers);
    </script>
</body>
</html>
