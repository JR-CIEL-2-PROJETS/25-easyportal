<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/log.css">
    <title>Easy Portal - Logs</title>
</head>
<body>
    <div class="header">
        <div class="logo">✦Easy Portal</div>
        <div class="user-name" id="userName">Chargement...</div>
    </div>

    <div class="sidebar">
        <a href="#">Dashboard</a>
        <a href="user.html">Utilisateurs</a>
        <a href="admin.html">Admin</a>
        <a href="plaques.html">Plaques</a>
        <a href="portail.html">Portail</a>
        <a href="logs.html" class="active">Logs</a>
    </div>

    <div class="main">
        <h2>Logs</h2>
        <div class="logs-container">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Rechercher par email ou plaque" oninput="filterLogs()" />
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Utilisateur</th>
                        <th>Date</th>
                        <th>Plaque</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script src="js/dejaconnecter.js"></script>
    <script>
        let logsData = [];

        async function fetchLogs() {
            try {
                const response = await fetch("php/getLogs.php");
                const data = await response.json();

                if (data.success) {
                    logsData = data.logs;
                    displayLogs(logsData);
                } else {
                    console.error("Erreur:", data.message);
                }
            } catch (error) {
                console.error("Erreur lors de la récupération des logs:", error);
            }
        }

        function displayLogs(logs) {
            const tableBody = document.getElementById("logsTableBody");
            tableBody.innerHTML = "";
            logs.forEach(log => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${log.email}</td>
                    <td>${log.date_entree}</td>
                    <td>${log.plaque}</td>
                    <td>${log.action}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function filterLogs() {
            const searchInput = document.getElementById("searchInput").value.toLowerCase();
            displayLogs(logsData.filter(log =>
                log.email.toLowerCase().includes(searchInput) || 
                log.plaque.toLowerCase().includes(searchInput)
            ));
        }

        document.addEventListener("DOMContentLoaded", fetchLogs);
    </script>
</body>
</html>
